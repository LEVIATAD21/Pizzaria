<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e63946">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https: data: blob:; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-ancestors 'none';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta name="description" content="Mania de Pizza — A pizza mais gostosa de Queimados, agora com app próprio!">
<title>Mania de Pizza — Bem-vindo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E🍕%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/global.css">
<style>
  body {
    background: linear-gradient(135deg, #fef3c7 0%, #ffe4e1 50%, #ffd6e0 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  
  /* Animação de fundo - Pizza flutuante */
  .floating-pizzas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  
  .floating-pizza {
    position: absolute;
    font-size: 40px;
    opacity: 0.15;
    animation: float 15s infinite ease-in-out;
  }
  
  .floating-pizza:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
  .floating-pizza:nth-child(2) { top: 20%; right: 10%; animation-delay: 2s; font-size: 60px; }
  .floating-pizza:nth-child(3) { bottom: 30%; left: 15%; animation-delay: 4s; font-size: 50px; }
  .floating-pizza:nth-child(4) { bottom: 10%; right: 5%; animation-delay: 1s; }
  .floating-pizza:nth-child(5) { top: 50%; left: 50%; animation-delay: 3s; font-size: 80px; }
  
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25% { transform: translateY(-20px) rotate(5deg) scale(1.05); }
    50% { transform: translateY(-10px) rotate(-5deg) scale(0.95); }
    75% { transform: translateY(-30px) rotate(3deg) scale(1.02); }
  }
  
  /* Hero Animation Container */
  .hero-animation-container {
    position: relative;
    max-width: 800px;
    margin: 0 auto 20px;
    padding: 0 20px;
  }
  
  .hero-svg-banner {
    width: 100%;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(230, 57, 70, 0.2);
    transition: transform 0.3s ease;
  }
  
  .hero-svg-banner:hover {
    transform: scale(1.02);
  }
  
  /* Animated Pizza Slice in Logo */
  .logo-container {
    position: relative;
    display: inline-block;
    animation: logoBounce 2s ease-in-out infinite;
  }
  
  @keyframes logoBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }
  
  .logo-pizza-spin {
    display: inline-block;
    animation: pizzaSpin 8s linear infinite;
  }
  
  @keyframes pizzaSpin {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
    100% { transform: rotate(0deg); }
  }
  
  /* Steam animation from hot pizza */
  .steam-container {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  
  .steam {
    width: 8px;
    height: 30px;
    background: linear-gradient(to top, rgba(255,255,255,0.6), transparent);
    border-radius: 50%;
    animation: steamRise 2s ease-in-out infinite;
  }
  
  .steam:nth-child(2) { animation-delay: 0.3s; height: 40px; }
  .steam:nth-child(3) { animation-delay: 0.6s; height: 35px; }
  
  @keyframes steamRise {
    0%, 100% { transform: translateY(0) scaleY(1); opacity: 0.6; }
    50% { transform: translateY(-15px) scaleY(1.2); opacity: 0.2; }
  }
  
  /* Delivery bike animation */
  .delivery-bike {
    position: fixed;
    bottom: 100px;
    left: -100px;
    font-size: 50px;
    z-index: 1;
    animation: deliverBike 12s linear infinite;
  }
  
  @keyframes deliverBike {
    0% { left: -100px; transform: scaleX(1); }
    45% { left: 100%; transform: scaleX(1); }
    50% { left: 100%; transform: scaleX(-1); }
    95% { left: -100px; transform: scaleX(-1); }
    100% { left: -100px; transform: scaleX(1); }
  }
  
  /* Pulse rings around hero */
  .pulse-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 300px;
    border: 3px solid rgba(230, 57, 70, 0.1);
    border-radius: 50%;
    animation: pulseRing 3s ease-out infinite;
    pointer-events: none;
  }
  
  .pulse-ring:nth-child(2) { animation-delay: 1s; }
  .pulse-ring:nth-child(3) { animation-delay: 2s; }
  
  @keyframes pulseRing {
    0% { width: 200px; height: 200px; opacity: 0.8; }
    100% { width: 500px; height: 500px; opacity: 0; }
  }
  
  .hero { text-align: center; padding: 30px 20px 20px; position: relative; z-index: 2; }
  .hero .logo {
    font-size: 80px; margin-bottom: 8px;
    filter: drop-shadow(0 6px 12px rgba(230,57,70,.3));
  }
  .hero h1 {
    font-size: 36px; font-weight: 800;
    color: var(--primary-dark); letter-spacing: -.5px;
    animation: titleGlow 3s ease-in-out infinite;
  }
  
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 10px rgba(230,57,70,0.3); }
    50% { text-shadow: 0 0 20px rgba(230,57,70,0.6), 0 0 30px rgba(230,57,70,0.4); }
  }
  
  .hero p { color: var(--text-muted); margin-top: 8px; font-size: 15px; }
  .role-grid {
    display: grid; grid-template-columns: 1fr; gap: 16px;
    max-width: 460px; margin: 30px auto 0; padding: 0 20px;
    position: relative; z-index: 2;
  }
  .role-card {
    background: #fff; border: 2px solid transparent;
    border-radius: 18px; padding: 22px; cursor: pointer;
    transition: transform .15s, box-shadow .2s, border-color .15s;
    text-align: left; display: flex; align-items: center;
    gap: 16px; width: 100%; font: inherit; color: inherit;
    position: relative; overflow: hidden;
  }
  .role-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(230,57,70,0.05), transparent);
    transition: left 0.5s;
  }
  .role-card:hover::before {
    left: 100%;
  }
  .role-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0,0,0,.12);
    border-color: var(--primary-light);
  }
  .role-card .icon {
    font-size: 44px; width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px; flex-shrink: 0;
    transition: transform 0.3s ease;
  }
  .role-card:hover .icon {
    transform: scale(1.1) rotate(5deg);
  }
  .role-card.cliente .icon { background: #fee2e2; }
  .role-card.motoboy .icon { background: #dbeafe; }
  .role-card.lojista .icon { background: #fef3c7; }
  .role-card .info h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .role-card .info p { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
  .footer-info {
    text-align: center; margin-top: 32px; padding: 0 20px 24px;
    color: var(--text-muted); font-size: 12px;
    position: relative; z-index: 2;
  }
  .footer-info a { color: var(--primary-dark); }
</style>
</head>
<body>

<!-- Pizzas flutuantes no fundo -->
<div class="floating-pizzas" aria-hidden="true">
  <div class="floating-pizza">🍕</div>
  <div class="floating-pizza">🍕</div>
  <div class="floating-pizza">🍕</div>
  <div class="floating-pizza">🍕</div>
  <div class="floating-pizza">🍕</div>
</div>

<!-- Moto de entrega animada -->
<div class="delivery-bike" aria-hidden="true">🛵💨</div>

<header class="hero">
  <div class="logo-container">
    <div class="logo logo-pizza-spin" aria-hidden="true">🍕</div>
    <div class="steam-container" aria-hidden="true">
      <div class="steam"></div>
      <div class="steam"></div>
      <div class="steam"></div>
    </div>
  </div>
  <h1>Mania de Pizza</h1>
  <p>Queimados-RJ · Como você quer entrar?</p>
  
  <!-- Pulse rings effect -->
  <div class="pulse-ring" aria-hidden="true"></div>
  <div class="pulse-ring" aria-hidden="true"></div>
  <div class="pulse-ring" aria-hidden="true"></div>
</header>

<!-- Banner SVG animado -->
<div class="hero-animation-container">
  <img src="assets/pizzaria-loop.svg" alt="Banner animado da pizzaria com rota de entrega" class="hero-svg-banner" loading="lazy" />
  <!-- Alternativa com GIF animado (descomente para usar) -->
  <!-- <img src="assets/motion-banner.gif" alt="Banner animado da pizzaria" class="hero-svg-banner" style="display:none;" /> -->
</div>

<main class="role-grid" role="navigation" aria-label="Escolha de perfil">
  <button class="role-card cliente" onclick="location.href='cliente-entrada.html'" aria-label="Sou Cliente">
    <div class="icon">🛒</div>
    <div class="info">
      <h3>Sou Cliente</h3>
      <p>Quero pedir uma pizza deliciosa com entrega em casa</p>
    </div>
  </button>

  <button class="role-card motoboy" onclick="location.href='motoboy-entrada.html'" aria-label="Sou Motoboy">
    <div class="icon">🛵</div>
    <div class="info">
      <h3>Sou Motoboy</h3>
      <p>Sou entregador parceiro da pizzaria</p>
    </div>
  </button>

  <button class="role-card lojista" onclick="location.href='login.html?staff=1'" aria-label="Acesso da Equipe">
    <div class="icon">🏪</div>
    <div class="info">
      <h3>Equipe da Loja</h3>
      <p>Atendentes, gerentes e dono — acesso restrito</p>
    </div>
  </button>
</main>

<div class="footer-info">
  <p>🔒 Sistema seguro · Dados protegidos · LGPD compliant</p>
  <p style="margin-top:6px">Mania de Pizza © 2026 · Queimados, RJ</p>
  <p style="margin-top:10px"><a href="download.html" style="font-size:12px">📦 Baixar código-fonte (ZIP)</a></p>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<script src="js/security.js"></script>
<script>
  (async function () {
    const s = await MDPSecurity.getSession();
    if (!s) return;
    const target = {
      cliente: 'comprador.html',
      motoboy: 'motoboy.html',
      atendente: 'painel-atendente.html',
      gerente: 'painel-gerente.html',
      dono: 'painel-gerente.html'
    }[s.role];
    if (target) {
      const cont = document.createElement('div');
      cont.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:14px 22px;border-radius:14px;display:flex;gap:12px;align-items:center;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw';
      cont.innerHTML =
        '<div style="font-size:14px">Logado como <b>' + MDPSecurity.escapeHtml(s.nome || s.email) + '</b></div>' +
        '<button onclick="location.href=\'' + target + '\'" style="background:#e63946;border:none;color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer">Continuar</button>' +
        '<button onclick="MDPSecurity.clearSession();location.reload()" style="background:transparent;border:1px solid #4b5563;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer">Sair</button>';
      document.body.appendChild(cont);
    }
  })();
</script>

</body>
</html>
