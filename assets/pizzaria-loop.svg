<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Mania de Pizza em movimento</title><desc id="desc">Rota de entrega e vapor do forno animados sobre o banner.</desc>
  <style>
    @keyframes dash { to { stroke-dashoffset: -72; } } @keyframes pulse { 0%,100%{opacity:.25;transform:scale(.86)}50%{opacity:.9;transform:scale(1.08)} } @keyframes steam { 0%{transform:translateY(24px);opacity:0}40%{opacity:.75}100%{transform:translateY(-20px);opacity:0} }
    .route{stroke-dasharray:12 12;animation:dash 3s linear infinite}.pulse{transform-origin:1050px 350px;animation:pulse 2.8s ease-in-out infinite}.steam{animation:steam 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.route,.pulse,.steam{animation:none}}
  </style>
  <image href="pizzaria-hero.png" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <path class="route" d="M604 220 C730 168 820 240 895 174" fill="none" stroke="#f7a65d" stroke-width="4" stroke-linecap="round"/>
  <circle class="pulse" cx="1050" cy="350" r="34" fill="none" stroke="#ffd08d" stroke-width="4"/>
  <path class="steam" d="M1160 250c-12-20 14-28 1-48" fill="none" stroke="#ffd8aa" stroke-width="5" stroke-linecap="round"/>
  <path class="steam" style="animation-delay:.8s" d="M1190 260c-12-20 14-28 1-48" fill="none" stroke="#ffd8aa" stroke-width="5" stroke-linecap="round"/>
</svg>
