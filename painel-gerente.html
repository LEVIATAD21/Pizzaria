<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https: data: blob:; img-src 'self' https: data: blob:; connect-src 'self' https: wss: https://*.tile.openstreetmap.org;">
<title>Painel do Gerente | Mania de Pizza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/global.css">
<style>
  body { background: #faf5ff; }
  .mdp-topbar { background: #7c3aed; color: #fff; border-color: #6d28d9; }
  .mdp-topbar h1 { color: #fff; }
  .mdp-back-btn { color: #fff; }
  .role-badge { background: #ede9fe !important; color: #6d28d9 !important; }
  .tabs { display: flex; gap: 4px; padding: 12px 18px 0; max-width: 1480px; margin: 0 auto; flex-wrap: wrap; }
  .tab {
    padding: 10px 18px; border-radius: 10px 10px 0 0; background: #fff;
    border: 1px solid #ddd6fe; border-bottom: none; cursor: pointer;
    font: 600 14px inherit; color: #6b21a8;
  }
  .tab.active { background: var(--surface); color: var(--primary-dark); border-color: var(--primary-light); border-bottom: 2px solid var(--surface); position: relative; top: 1px; }
  .tab .badge-num {
    display: inline-block; min-width: 20px; padding: 2px 6px;
    background: #f43f5e; color: #fff; border-radius: 999px;
    font-size: 11px; margin-left: 6px;
  }
  .panel { background: #fff; border-radius: 0 18px 18px 18px; padding: 18px; min-height: 60vh; }

  /* KPIs */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi-card { background: linear-gradient(135deg, #f5f3ff 0%, #fff 100%); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .kpi-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
  .kpi-card .value { font-size: 26px; font-weight: 800; color: var(--primary-dark); margin-top: 4px; }

  /* Kanban */
  .kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .kcol { background: #f9fafb; border-radius: 14px; padding: 12px; min-height: 300px; }
  .kcol h3 { font-size: 14px; margin-bottom: 8px; padding: 0 4px; display: flex; justify-content: space-between; }
  .pcard {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-bottom: 8px; cursor: pointer;
    transition: box-shadow .15s, transform .1s;
  }
  .pcard:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .pcard b { font-size: 14px; }
  .pcard small { color: var(--text-muted); font-size: 12px; display: block; }
  .pcard.alert {
    border-color: #dc2626; background: #fee2e2;
    animation: pulseRed 1.5s infinite;
  }
  @keyframes pulseRed {
    0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,.5); }
    50% { box-shadow: 0 0 0 8px rgba(220,38,38,0); }
  }

  /* Alarmes painel lateral */
  .alarms-panel {
    background: #fff7ed; border: 2px solid #fb923c; border-radius: 14px;
    padding: 14px; margin-bottom: 14px;
  }
  .alarm-item { background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

  /* QR display */
  .qr-display {
    text-align: center; padding: 30px;
    background: linear-gradient(135deg, #fafafa, #f0f9ff);
    border-radius: 18px;
  }
  .qr-display .qr-canvas {
    display: inline-block; padding: 20px; background: #fff;
    border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.1);
  }
  .qr-display .qr-canvas canvas { display: block; }
  .qr-progress {
    width: 100%; max-width: 260px; height: 8px;
    background: #e5e7eb; border-radius: 4px; overflow: hidden;
    margin: 14px auto;
  }
  .qr-progress > div { height: 100%; background: #10b981; transition: width .3s linear; }

  /* Motoboy list */
  .motoboy-row {
    display: grid; grid-template-columns: 50px 1fr auto; gap: 12px;
    align-items: center; padding: 10px;
    border-bottom: 1px solid var(--border);
  }
  .motoboy-row img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #f1f5f9; }
  #map-frota { height: 400px; border-radius: 14px; }
</style>
</head>
<body>

<header class="mdp-topbar">
  <span id="back-slot"></span>
  <h1>👔 Gerente — Torre de Controle</h1>
  <span class="role-badge" id="role-show">Gerente</span>
  <button class="mdp-btn secondary" style="padding:6px 12px;font-size:13px" id="user-chip">…</button>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="kanban">📋 Pedidos (Kanban) <span class="badge-num" id="badge-pedidos">0</span></button>
  <button class="tab" data-tab="qr">🔁 QR Ponto</button>
  <button class="tab" data-tab="motoboys">🛵 Motoboys <span class="badge-num" id="badge-aprovar">0</span></button>
  <button class="tab" data-tab="frota">🗺️ Frota ao vivo</button>
  <button class="tab" data-tab="produtos">🍕 Produtos</button>
</nav>

<main class="mdp-container wide" style="margin-top:0">
  <div class="panel" id="panel-kanban"></div>
  <div class="panel" id="panel-qr" style="display:none"></div>
  <div class="panel" id="panel-motoboys" style="display:none"></div>
  <div class="panel" id="panel-frota" style="display:none"></div>
  <div class="panel" id="panel-produtos" style="display:none"></div>
</main>

<audio id="alarm-sound" preload="auto">
  <source src="data:audio/wav;base64,UklGRrYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZIAAAB+f4B/f3+Af4B/gH9/f4B/f3+Af3+AgIB/f3+Af39/gH+Af3+AgIB/f3+Af4B/f4CAgIB/f4B/f3+Af4B/f4CAgIB/f4B/gH9/gIB/gIB/f4CAgIB/f3+AgH+AgH9/gIB/gH9/gIB/gIB/f4CAgH+Af4B/f4CAf4CAf3+AgH9/gIB/f4CAf4CAf3+AgH+AgIA=" type="audio/wav">
</audio>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="js/security.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/qr-core.js"></script>
<script src="js/validators.js"></script>
<script src="js/painel-gerente.js"></script>
</body>
</html>
